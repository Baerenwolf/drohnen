{{ define "main" }}
<section class="hero">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
</section>

{{ $pages := where .Site.RegularPages "Section" "portfolio" }}
{{ if $pages }}
  <div class="portfolio-grid">
    {{ range $pages }}
      <article class="portfolio-card">
        <a href="{{ .Permalink }}">
          <div class="thumb">📹</div>
          <div class="meta">
            <h3>{{ .Title }}</h3>
            <p>{{ with .Description }}{{ . }}{{ end }}</p>
          </div>
        </a>
      </article>
    {{ end }}
  </div>
{{ end }}
{{ end }}
