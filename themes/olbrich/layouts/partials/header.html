<header class="site-header">
  <nav class="container">
    <a class="brand" href="/">{{ .Site.Title }}</a>
    <ul>
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
